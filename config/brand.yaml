# Perfil de marca y marketing de GLOBUS.
# Fuente visual de referencia: GIS 1.0 (Ink / Paper / Meridian).
# Este archivo vive SOLO en Pulse. No modifica Core ni Core-Web.

name: Globus
legal_name: Globus
tagline: El sistema operativo de tu empresa
signature: Globus — el sistema operativo de tu empresa
description: >
  Globus es el sistema operativo de la empresa: CRM, inventario, tickets,
  ventas, WhatsApp, IA y automatizaciones en un solo producto multi-tenant.
  Se configura una vez y opera el negocio sin parches sueltos.

what_we_sell:
  - Sistema operativo empresarial modular
  - CRM y pipeline de ventas
  - Inventario y compras
  - Tickets y field service
  - WhatsApp operativo
  - Automatizaciones e IA aplicada
  - Onboarding con propuesta comercial

audience:
  - Dueños de PyME que ya no caben en hojas de cálculo
  - Equipos comerciales que pierden follow-up
  - Operaciones que viven en WhatsApp y Excel
  - Empresas que quieren un sistema, no otra app suelta

value_proposition: >
  Un solo sistema para vender, operar y dar seguimiento.
  Módulos enchufables. Multi-tenant. Listo para producir clientes.

tone:
  - directo
  - comercial
  - claro
  - profesional
  - sin humo

forbidden:
  - "sinergia"
  - "disruptivo"
  - "revolucionamos"
  - "hackea tu"
  - "gurú"
  - emojis excesivos
  - promesas milagrosas

cta_library:
  - Crea tu propuesta
  - Empieza con Globus
  - Arma tu operación
  - Solicita una propuesta
  - Pasa de Excel a sistema

primary_cta: Crea tu propuesta
conversion_path: /crear-propuesta
url: https://globus.app
conversion_url: https://globus.app/crear-propuesta

hashtags:
  - Globus
  - OperacionEmpresarial
  - CRM
  - Automatizacion
  - PyME

